<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор эффективности товарных категорий</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#fff;color:#222;margin:0;padding:20px}
.container{max-width:1500px;margin:auto}
h1{font-size:22px}
.period{margin:15px 0}
input,select{padding:5px;border:1px solid #ccc;border-radius:4px}
input:focus{outline:none;border:2px solid #4a90d9;background:rgba(74,144,217,.05)}
table{width:100%;border-collapse:collapse;margin-top:15px;font-size:13px}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
th{background:#f5f5f5}
td input{width:100%;box-sizing:border-box}
tr.good td{background:#e6f7e6}
tr.warn td{background:#fff7d6}
tr.bad td{background:#ffe6e6}
.rec{text-align:left;max-width:280px;font-size:12px}
button{margin:8px 5px;padding:6px 14px;cursor:pointer;border:1px solid #ccc;border-radius:4px;background:#f9f9f9}
button:hover{background:#eee}
.totals{margin-top:20px;padding:15px;background:#f9f9f9;border-radius:6px}
footer{margin-top:30px;text-align:center}
.logo{width:120px;display:block;margin:0 auto 8px}
</style>
</head>
<body>
<div class="container">
<h1>Калькулятор эффективности товарных категорий</h1>
<div class="period">
<label>Период анализа: </label>
<input type="month" id="period">
</div>
<table id="tbl">
<thead><tr>
<th>Категория</th><th>Заказы</th><th>Выручка</th><th>Закупка</th><th>Реклама</th>
<th>Валовая прибыль</th><th>Маржинальность</th><th>Ср. чек</th><th>CPO</th><th>ДРР</th>
<th>Прибыль после рекламы</th><th>ROMI</th><th>Статус</th><th>Рекомендация</th><th></th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
<button onclick="addRow()">+ Добавить категорию</button>
<button onclick="exportXlsx()">Скачать Excel</button>
<div class="totals" id="totals"></div>
<footer>
<img src="logo.png" class="logo" onerror="this.style.display='none'">
<a href="https://alexa77-oss.github.io/calculator/before-launch.html" target="_blank">Открыть старый калькулятор</a>
</footer>
</div>
<script>
let rows=[emptyRow()];
function emptyRow(){return{name:'',orders:'',revenue:'',cost:'',ads:''}}
function calc(r){const o=+r.orders||0,rev=+r.revenue||0,c=+r.cost||0,a=+r.ads||0;
const gp=rev-c,mar=rev?gp/rev*100:0,ac=o?rev/o:0,cpo=o?a/o:0,drr=rev?a/rev*100:0,paa=gp-a,romi=a?paa/a*100:0;
return{gp,mar,ac,cpo,drr,paa,romi}}
function status(r){if(r.paa>0&&r.romi>=50)return'good';if(r.paa>0||r.romi>=0)return'warn';return'bad'}
function rec(r){let p=[];
if(r.paa>0&&r.romi>=50){p.push('Категория эффективна: прибыль после рекламы положительная, ROMI высокий. Проверьте наличие и спрос перед масштабированием.')}
else if(r.paa>0){p.push('Прибыль есть, но ROMI невысокий — реклама съедает часть валовой прибыли. Проверьте CPO и креативы.')}
else{p.push('Реклама не окупается: валовая прибыль не покрывает расходы. Снизьте ставки или остановите продвижение.')}
if(r.mar<20)p.push('Низкая маржинальность — проверьте закупочные цены и наценку.');
return p.join(' ')}
function render(){const tb=document.getElementById('tbody');tb.innerHTML='';
let tr=0,tc=0,ta=0,tgp=0,tpaa=0;
rows.forEach((r,i)=>{const c=calc(r);tr+=+r.revenue||0;tc+=+r.cost||0;ta+=+r.ads||0;tgp+=c.gp;tpaa+=c.paa;
const st=status(c);
tb.innerHTML+=`<tr class="${st}">
<td><input value="${r.name}" oninput="upd(${i},'name',this.value)" placeholder="Название"></td>
<td><input type="number" value="${r.orders}" oninput="upd(${i},'orders',this.value)"></td>
<td><input type="number" value="${r.revenue}" oninput="upd(${i},'revenue',this.value)"></td>
<td><input type="number" value="${r.cost}" oninput="upd(${i},'cost',this.value)"></td>
<td><input type="number" value="${r.ads}" oninput="upd(${i},'ads',this.value)"></td>
<td>${c.gp.toFixed(0)}</td><td>${c.mar.toFixed(1)}%</td><td>${c.ac.toFixed(0)}</td>
<td>${c.cpo.toFixed(0)}</td><td>${c.drr.toFixed(1)}%</td><td>${c.paa.toFixed(0)}</td><td>${c.romi.toFixed(1)}%</td>
<td>${st==='good'?'Хорошо':st==='warn'?'На грани':'Плохо'}</td>
<td class="rec">${rec(c)}</td>
<td><button onclick="delRow(${i})">✕</button></td></tr>`});
const tromi=ta?tpaa/ta*100:0,tdrr=tr?ta/tr*100:0;
document.getElementById('totals').innerHTML=`<h3>Итоги</h3>
<p>Выручка: ${tr.toFixed(0)} ₽ | Валовая прибыль: ${tgp.toFixed(0)} ₽ | Реклама: ${ta.toFixed(0)} ₽</p>
<p>Прибыль после рекламы: ${tpaa.toFixed(0)} ₽ | ROMI: ${tromi.toFixed(1)}% | ДРР: ${tdrr.toFixed(1)}%</p>`;
localStorage.setItem('rows',JSON.stringify(rows));
localStorage.setItem('period',document.getElementById('period').value)}
function upd(i,f,v){rows[i][f]=v;render()}
function addRow(){if(rows.length<100){rows.push(emptyRow());render()}}
function delRow(i){rows.splice(i,1);if(!rows.length)rows=[emptyRow()];render()}
function exportXlsx(){const p=document.getElementById('period').value||'period';
const data=[['Категория','Заказы','Выручка','Закупка','Реклама','Валовая прибыль','Маржинальность','Ср.чек','CPO','ДРР','Прибыль после рекламы','ROMI']];
rows.forEach((r,i)=>{const n=i+2;
data.push([r.name||'',+r.orders||0,+r.revenue||0,+r.cost||0,+r.ads||0,
{f:`C${n}-D${n}`},{f:`IF(C${n}=0,0,F${n}/C${n}*100)`},{f:`IF(B${n}=0,0,C${n}/B${n})`},
{f:`IF(B${n}=0,0,E${n}/B${n})`},{f:`IF(C${n}=0,0,E${n}/C${n}*100)`},
{f:`F${n}-E${n}`},{f:`IF(E${n}=0,0,L${n}/E${n}*100)`}])});
const ws=XLSX.utils.aoa_to_sheet(data),wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,'Категории');
XLSX.writeFile(wb,`categories_${p}.xlsx`)}
document.getElementById('period').value=localStorage.getItem('period')||'';
const saved=localStorage.getItem('rows');if(saved)rows=JSON.parse(saved);
render();
</script>
</body>
</html>
